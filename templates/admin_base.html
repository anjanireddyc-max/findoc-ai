<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>FinDocAI | {% block title %}Admin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        .admin-main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
        .admin-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        .admin-top h1 { font-size: 30px; margin: 6px 0 4px; color: var(--ink); }
        .admin-top p { color: var(--muted); margin: 0; }
        .admin-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .admin-tabs a, .admin-tabs button {
            padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper);
            color: var(--ink-soft); font: 600 14px 'Inter', Arial, sans-serif; text-decoration: none; cursor: pointer; }
        .admin-tabs a.active { background: var(--ink); color: #fff; border-color: var(--ink); }
        .admin-tabs form { margin: 0; }
        .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 20px; }
        .panel h2 { font-size: 18px; margin: 0 0 4px; color: var(--ink); }
        .panel .hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
        .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
        .stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fff; }
        .stat .label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
        .stat .value { font-size: 26px; font-weight: 800; color: var(--ink); margin-top: 4px; font-variant-numeric: tabular-nums; }
        .stat .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .ok, .stat .value.ok { color: var(--sage); } .bad, .stat .value.bad { color: var(--accent); }
        .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .pill.tampered, .pill.edited, .pill.fail { background: #f7e1da; color: var(--accent-dark); }
        .pill.genuine, .pill.clean, .pill.pass { background: #e3ece1; color: #3f5d3f; }
        .pill.rejected { background: #ece8e0; color: var(--ink-soft); }
        .table-wrap { overflow-x: auto; }
        table.admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .admin-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
            padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
        .admin-table td { padding: 10px; border-bottom: 1px solid var(--line); color: var(--ink-soft); vertical-align: top; }
        .admin-table td.num { font-variant-numeric: tabular-nums; }
        .notice { border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; font-size: 14px; line-height: 1.5; }
        .notice.info { background: #f6efe3; border: 1px solid #e8d8bd; color: var(--ink-soft); }
        .notice.success { background: #e3ece1; border: 1px solid #c7d8c3; color: #34503a; }
        .notice.error { background: #f7e1da; border: 1px solid #edc2b5; color: var(--accent-dark); }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-weight: 600; color: var(--ink); margin-bottom: 6px; font-size: 14px; }
        .field input[type=number], .field input[type=password], .field input[type=text] {
            width: 100%; max-width: 360px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
            font: 15px 'Inter', Arial, sans-serif; background: #fff; color: var(--ink); box-sizing: border-box; }
        .field .help { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--ink-soft); font-size: 15px; }
        .check input { width: 18px; height: 18px; accent-color: var(--accent); }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .abtn { padding: 11px 18px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: #fff;
            font: 600 14px 'Inter', Arial, sans-serif; cursor: pointer; text-decoration: none; }
        .abtn.accent { background: var(--accent); border-color: var(--accent); }
        .abtn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
        .two-col { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .muted { color: var(--muted); }
        @media (max-width: 600px) { .admin-top h1 { font-size: 24px; } .panel { padding: 16px; } }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="/" class="brand">
            <div class="brand-icon">FD</div>
            <div class="brand-name">FinDoc<span>AI</span></div>
        </a>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/detect">Detect</a>
            <a href="/admin/" class="active">Admin</a>
        </nav>
    </div>
</header>

<main class="admin-main">
    {% if session.get('admin') %}
    <div class="admin-top">
        <div>
            <div class="eyebrow"><span></span>ADMIN PANEL</div>
            <h1>{% block heading %}Admin{% endblock %}</h1>
            <p>{% block subheading %}{% endblock %}</p>
        </div>
        <div class="admin-tabs">
            <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
            <a href="{{ url_for('admin.settings_page') }}" class="{{ 'active' if active == 'settings' }}">Settings</a>
            <a href="{{ url_for('admin.self_test') }}" class="{{ 'active' if active == 'selftest' }}">Self-test</a>
            <form method="post" action="{{ url_for('admin.logout') }}">
                <input type="hidden" name="csrf" value="{{ csrf_token() }}">
                <button type="submit">Log out</button>
            </form>
        </div>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>

</body>
</html>
